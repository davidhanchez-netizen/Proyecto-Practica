<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swag Labs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <h1>Swag Labs</h1>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button type="submit">Login</button>

        </form>

        <p id="mensaje"></p>

        <section class="info-login">

            <div>
                <h3>Accepted usernames are:</h3>

                <p>standard_user</p>
                <p>locked_out_user</p>
                <p>problem_user</p>
                <p>performance_glitch_user</p>
                <p>error_user</p>
                <p>visual_user</p>
            </div>

            <div>
                <h3>Password for all users:</h3>
                <p>secret_sauce</p>
            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
